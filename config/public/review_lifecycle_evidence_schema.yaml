review_lifecycle_evidence_schema:
  schema_version: review-evidence-v1
  purpose: Public-safe lifecycle review metadata for post-hoc auditability.
  tracked_runtime_evidence_allowed: false
  private_detail_location: data/private/reviews/
  required_fields:
    - schema_version
    - evidence_id
    - lifecycle_unit_id
    - issue_id
    - change_scope
    - git_base_ref
    - git_head_ref
    - originating_reviewer
    - reviewer_role
    - review_round
    - rerun_of_evidence_id
    - same_originating_reviewer
    - review_status
    - reviewed_public_paths
    - private_context_used
    - private_context_descriptor
    - findings
    - remediations
    - validations
    - approval_status
    - created_at
  reviewers:
    - retail_architecture_reviewer
    - retail_change_reviewer
    - retail_business_rules_reviewer
    - retail_contract_reviewer
    - retail_test_planner
  reviewer_roles:
    - architecture
    - change
    - business_rules
    - contract
    - test_planning
  terminal_approval_statuses:
    - NEXT_LAYER_APPROVED
    - APPROVED_FOR_COMMIT
    - BUSINESS_RULES_APPROVED
  optional_dashboard_ui_fields:
    - screen
    - business_question
    - visualization_types_reviewed
    - metrics_reviewed
    - fmcg_review_status
    - product_information_architecture_status
    - bi_visualization_status
    - b2b_ui_ux_status
    - architecture_status
    - business_rules_status
    - private_rendered_acceptance_status
  optional_reference_report_parity_fields:
    - private_reference_report_registered
    - private_metric_placement_contract_registered
    - private_visual_semantics_contract_registered
    - affected_parity_concepts
    - placement_concepts_reviewed
    - pre_code_design_table_completed
    - post_code_parity_table_completed
    - rendered_private_acceptance_completed
    - parity_access_removed_or_degraded
    - semantics_introduced_or_reinterpreted
    - unresolved_parity_gap_surfaced
    - parity_impact_status
    - placement_impact_status
  reference_report_parity:
    contract_path: config/public/reference_report_parity_contract.yaml
    applies_to_meaningful_analytical_or_product_semantic_changes: true
    full_reference_audit_required_for_visual_only_changes: false
    private_metric_placement_contract_required_for_meaningful_ui_parity: true
    private_visual_semantics_contract_required_after_placement_review: true
    backend_ready_is_not_visible_parity: true
    cosmetic_label_change_satisfies_parity: false
    parity_impact_statuses:
      - NOT_APPLICABLE
      - REVIEWED_NO_IMPACT
      - REVIEWED_IMPACT_ACCEPTED
      - CHANGES_REQUIRED
    placement_impact_statuses:
      - NOT_APPLICABLE
      - REVIEWED_NO_IMPACT
      - REVIEWED_PLACEMENT_ACCEPTED
      - CHANGES_REQUIRED
  finding_fields:
    - finding_id
    - severity
    - status
    - public_summary
    - affected_public_paths
    - requires_private_followup
  privacy_rules:
    forbidden_public_path_markers:
      - config/private
      - data/private
      - docs/private
    forbidden_payload_keys:
      - retailer_name
      - source_column
      - source_columns
      - threshold_value
      - private_notes
      - private_payload
      - business_rule_text
      - private_config_snippet
  same_reviewer_rerun:
    required_fields:
      - originating_reviewer
      - rerun_of_evidence_id
      - same_originating_reviewer
      - review_round
    rule: same_originating_reviewer=true requires rerun_of_evidence_id and review_round greater than the original round.

policy_version: dashboard_visualization_policy.v1.1.0
purpose: Public-safe authority for dashboard screen design and visualization choices.
semantic_boundary:
  metric_catalog_role: taxonomy_of_data
  dashboard_ia_role: taxonomy_of_business_questions
  formula_source: metric_catalog_and_business_rules
  forbidden: duplicate_metric_formulas_in_policy

expert_model:
  - id: senior_fmcg_commercial_analytics_lead
    responsibility:
      - business_questions
      - kpi_priority
      - decision_usefulness
      - diagnostic_hierarchy
  - id: product_information_architect
    responsibility:
      - screen_purpose
      - block_hierarchy
      - progressive_disclosure
      - drilldown
      - duplication_avoidance
  - id: senior_bi_visualization_specialist
    responsibility:
      - visualization_type
      - axes
      - comparisons
      - sparse_history
      - rankings
      - shares
      - contributions
  - id: senior_b2b_analytics_ui_ux_designer
    responsibility:
      - layout
      - scan_speed
      - filters
      - tables
      - responsive_behavior
      - accessibility
  - id: retail_data_architecture_reviewer
    responsibility:
      - readiness
      - routes
      - provenance
      - performance
      - no_frontend_calculations
  - id: retail_business_rules_reviewer
    responsibility:
      - formulas
      - aggregation
      - causality
      - statuses
      - comparison_semantics
      - private_label_scope

enums:
  visualization_types:
    - KPI
    - LINE
    - BAR
    - STACKED_BAR
    - RANKED_BAR
    - RANKED_TABLE
    - DETAIL_TABLE
    - DRIVER_MATRIX
    - COMPARISON_STRIP
    - DUMBBELL
    - BULLET
    - AVAILABILITY_GRID
    - SIGNAL_LIST
    - PROVENANCE_DRAWER
    - HEATMAP
    - WATERFALL
  discouraged_visualizations:
    - PIE
    - DONUT
    - RADAR
    - GAUGE
    - MULTI_AXIS_CHART
  readiness:
    - READY_QUERY
    - READY_PROJECTION
    - BACKEND_ROUTE_REQUIRED
    - PARTIAL
    - BUSINESS_RULE_REQUIRED
    - FUTURE
    - AUDIT_ONLY
  period_modes:
    - SINGLE_PERIOD
    - COMPARE
    - DATE_RANGE
  grains:
    - network
    - category
    - manufacturer
    - brand
    - sku
    - store
  presentation_priority:
    - PRIMARY
    - SECONDARY
    - DETAIL
    - AUDIT

interaction_model:
  report_structure: continuous_vertical_report
  section_navigation:
    behavior: sticky_in_page_anchors
    scrollspy_required: true
    exactly_one_active_section: true
    section_ids:
      overview: overview
      sales_drivers: sales-drivers
      portfolio_market: portfolio-market
      stores: stores
      signals: signals
      data: data
    hidden_tab_panels_allowed: false
  analytical_scope:
    layout: single_compact_row
    duplicated_scope_controls_allowed: false
    controls_order:
      - retailer
      - period
      - category
      - manufacturer
      - brand
      - sku
      - store
      - private_label_scope
    period_configuration: collapsed_control_with_popover
    selected_filter_chips_allowed: false
    current_scope_sentence_allowed: coverage_note_only_when_meaningful
  filter_behavior:
    browse_without_typing_required_for: [manufacturer, brand, sku, store]
    typeahead_required_for: [manufacturer, brand, sku, store]
    typeahead_must_not_reload_analytics_before_selection: true
    bounded_option_rendering_required: true
    cascade: category_to_manufacturer_to_brand_to_sku
    store_filter: orthogonal
  drilldown:
    breadcrumb_represents: selected_analytical_entity_path_only
    breadcrumb_hidden_without_drilldown: true

screens:
  - id: overview
    label_ru: Обзор
    purpose: What happened, how material it is, where to look, what changed together, what to check next.
    primary_questions:
      - Что произошло?
      - Насколько существенно?
      - Где произошло изменение?
      - Что изменилось одновременно?
      - Что проверить?
    allowed_visualizations: [KPI, LINE, RANKED_TABLE, DRIVER_MATRIX, SIGNAL_LIST, PROVENANCE_DRAWER]
    default_blocks:
      - id: primary_kpi
        visualizations: [KPI]
        readiness_requirement: READY_QUERY
      - id: main_trend
        visualizations: [LINE]
        readiness_requirement: READY_QUERY
      - id: contribution_drilldown
        visualizations: [RANKED_TABLE]
        readiness_requirement: READY_QUERY
      - id: change_picture
        visualizations: [DRIVER_MATRIX]
        readiness_requirement: READY_QUERY
      - id: attention_preview
        visualizations: [SIGNAL_LIST]
        readiness_requirement: PARTIAL
      - id: provenance
        visualizations: [PROVENANCE_DRAWER]
        readiness_requirement: READY_QUERY
    max_kpi: 4
    max_primary_charts: 1
    max_preview_rows: 8
    max_signal_preview: 3
    forbidden_concepts:
      - recommendations
      - direct_peers
      - abc
      - brand_composite_status
      - delisting
      - opportunity_facts
  - id: sales_drivers
    label_ru: Продажи и драйверы
    purpose: Diagnose result, volume, price, presence, sales speed, economics, and structure without causal overclaim.
    primary_questions:
      - Как изменился коммерческий результат?
      - Какие параметры изменились одновременно?
      - Где нужна deeper diagnosis?
    allowed_visualizations: [DRIVER_MATRIX, LINE, COMPARISON_STRIP, DETAIL_TABLE, PROVENANCE_DRAWER]
    default_blocks:
      - id: driver_matrix
        visualizations: [DRIVER_MATRIX]
        readiness_requirement: READY_QUERY
      - id: selected_metric_trend
        visualizations: [LINE]
        readiness_requirement: READY_QUERY
      - id: driver_detail_table
        visualizations: [DETAIL_TABLE]
        readiness_requirement: READY_QUERY
    max_kpi: 0
    max_primary_charts: 1
    max_preview_rows: 0
    forbidden_concepts:
      - manufacturer_rank_revenue
      - manufacturer_rank_units
      - direct_peers
      - recommendations
  - id: portfolio_market
    label_ru: Портфель и рынок
    purpose: Category position, shares, ranking, assortment, brand-vs-category, market/private-label, and competitors where ready.
    primary_questions:
      - Как мы стоим в категории?
      - Что происходит с долей?
      - Какое место производителя?
      - Что происходит с ассортиментом?
      - Как бренд движется относительно категории?
    allowed_visualizations: [RANKED_BAR, RANKED_TABLE, BAR, STACKED_BAR, DUMBBELL, BULLET, COMPARISON_STRIP, DETAIL_TABLE, PROVENANCE_DRAWER]
    default_blocks:
      - id: category_position
        visualizations: [RANKED_BAR, RANKED_TABLE]
        readiness_requirement: READY_PROJECTION
      - id: assortment
        visualizations: [BULLET, COMPARISON_STRIP]
        readiness_requirement: READY_PROJECTION
      - id: brand_vs_category
        visualizations: [DUMBBELL, COMPARISON_STRIP]
        readiness_requirement: READY_PROJECTION
      - id: market_private_label
        visualizations: [BAR, COMPARISON_STRIP]
        readiness_requirement: READY_PROJECTION
      - id: competitors
        visualizations: [DETAIL_TABLE]
        readiness_requirement: PARTIAL
    max_kpi: 2
    max_primary_charts: 2
    max_preview_rows: 10
    forbidden_concepts:
      - brand_composite_status
      - delisting
      - direct_peers
      - recommendations
  - id: stores
    label_ru: Точки продаж
    purpose: Show where physical store-level result forms.
    primary_questions:
      - Какие ТТ формируют результат?
      - Где меняются продажи и экономика?
      - Где нужна store-level action?
    allowed_visualizations: [RANKED_BAR, DETAIL_TABLE, HEATMAP, PROVENANCE_DRAWER]
    default_blocks:
      - id: store_ranking
        visualizations: [RANKED_BAR]
        readiness_requirement: READY_QUERY
      - id: store_detail_table
        visualizations: [DETAIL_TABLE]
        readiness_requirement: READY_QUERY
    max_kpi: 2
    max_primary_charts: 1
    max_preview_rows: 23
    forbidden_concepts:
      - distribution
      - velocity
      - revenue_velocity
      - margin_velocity
      - direct_peers
      - recommendations
  - id: signals
    label_ru: Сигналы
    purpose: Separate attention-worthy deterministic patterns from data-quality alerts and capability limitations.
    primary_questions:
      - Что требует внимания?
      - На каком правиле основан сигнал?
      - Куда перейти для проверки?
    allowed_visualizations: [SIGNAL_LIST, DETAIL_TABLE, PROVENANCE_DRAWER]
    default_blocks:
      - id: commercial_signals
        visualizations: [SIGNAL_LIST]
        readiness_requirement: PARTIAL
      - id: data_quality_alerts
        visualizations: [SIGNAL_LIST]
        readiness_requirement: READY_QUERY
    max_kpi: 0
    max_primary_charts: 0
    max_preview_rows: 20
    forbidden_concepts:
      - recommendations
      - ordinary_delta_as_signal
      - capability_limitation_as_commercial_signal
  - id: data
    label_ru: Данные
    purpose: Show what data is included, coverage, quality, source-like rows, and audit access.
    primary_questions:
      - Какие данные используются?
      - Можно ли им доверять?
      - Где посмотреть покрытие и качество?
    allowed_visualizations: [AVAILABILITY_GRID, DETAIL_TABLE, PROVENANCE_DRAWER, SIGNAL_LIST]
    default_blocks:
      - id: period_coverage
        visualizations: [AVAILABILITY_GRID]
        readiness_requirement: READY_QUERY
      - id: quality
        visualizations: [SIGNAL_LIST, DETAIL_TABLE]
        readiness_requirement: READY_QUERY
      - id: source_like_rows
        visualizations: [DETAIL_TABLE]
        readiness_requirement: READY_QUERY
      - id: audit
        visualizations: [PROVENANCE_DRAWER]
        readiness_requirement: READY_QUERY
    max_kpi: 0
    max_primary_charts: 0
    max_preview_rows: 50
    forbidden_concepts:
      - recommendations
      - hashes_as_primary_content

business_concept_rules:
  contribution_to_delta:
    supported_metric_concepts: [revenue_vat, revenue, units, retailer_margin_abs]
    preferred_visualization: RANKED_TABLE
    alternative_visualizations: [BAR]
    forbidden_visualizations: [PIE, DONUT, WATERFALL]
    columns_ru: [Объект, Текущий период, Период сравнения, Изменение, Вклад в изменение]
    default_sort: absolute_delta_desc
    period_modes:
      SINGLE_PERIOD: NOT_APPLICABLE
      COMPARE: READY_QUERY
      DATE_RANGE: NOT_APPLICABLE
    guardrails:
      - signed_share_may_exceed_100_or_be_negative
      - never_clamp_to_0_100
      - no_causal_wording
      - total_delta_zero_returns_undefined_share
  sparse_time_history:
    preferred_visualization: LINE
    guardrails:
      - actual_available_periods_only
      - no_zero_fill
      - no_smoothing
      - no_interpolation
  shares:
    preferred_visualization: BAR
    alternative_visualizations: [COMPARISON_STRIP, DETAIL_TABLE]
    forbidden_visualizations: [PIE, DONUT]
    guardrails:
      - recompute_from_numerator_denominator
      - do_not_average_monthly_shares
  ranking:
    preferred_visualization: RANKED_BAR
    alternative_visualizations: [RANKED_TABLE]
    forbidden_visualizations: [KPI]
    guardrails:
      - show_ranking_universe
      - show_tie_policy_where_relevant
  brand_vs_category:
    preferred_visualization: DUMBBELL
    alternative_visualizations: [COMPARISON_STRIP, DETAIL_TABLE]
    forbidden_visualizations: [KPI]
    guardrails:
      - no_growth_decline_status_badge
      - show_brand_and_category_reference
  stores:
    preferred_visualization: RANKED_BAR
    alternative_visualizations: [DETAIL_TABLE, HEATMAP]
    forbidden_visualizations: []
    guardrails:
      - no_store_grain_distribution
      - no_store_grain_velocity
      - map_not_default
  signals:
    preferred_visualization: SIGNAL_LIST
    guardrails:
      - signal_is_not_ordinary_delta
      - signal_is_not_recommendation
      - capability_limitation_is_not_commercial_signal
  coverage:
    preferred_visualization: AVAILABILITY_GRID
    alternative_visualizations: [DETAIL_TABLE]
    forbidden_visualizations: [LINE]
  provenance:
    preferred_visualization: PROVENANCE_DRAWER
    guardrails:
      - technical_metadata_collapsed_by_default

period_rules:
  additive_metrics:
    concepts: [revenue_vat, revenue, units, retailer_margin_abs]
    SINGLE_PERIOD: READY_QUERY
    COMPARE: READY_QUERY
    DATE_RANGE: READY_QUERY
    range_strategy: sum_available_periods
  ratio_of_sums_metrics:
    concepts: [retailer_margin_pct]
    SINGLE_PERIOD: READY_QUERY
    COMPARE: READY_QUERY
    DATE_RANGE: READY_QUERY
    range_strategy: ratio_of_sums
  weighted_metrics:
    concepts: [weighted_shelf_price_vat, weighted_input_price_vat]
    SINGLE_PERIOD: READY_QUERY
    COMPARE: READY_QUERY
    DATE_RANGE: READY_QUERY
    range_strategy: weighted_ratio_of_sums
  period_only_metrics:
    concepts: [selling_store_count, active_store_count, distribution, velocity, revenue_velocity, margin_velocity, sku_count, brand_count, category_count, category_revenue_share, category_units_share, category_margin_share]
    SINGLE_PERIOD: READY_QUERY
    COMPARE: READY_QUERY
    DATE_RANGE: PARTIAL
    range_strategy: period_only

table_policy:
  default:
    pagination_required: true
    provenance_required: true
    conditional_formatting: restrained_directional_not_good_bad
  grains:
    category:
      default_columns: [category, revenue, contribution_to_delta, units, retailer_margin_abs, retailer_margin_pct, sku_count, selling_store_count]
      default_sort: contribution_absolute_delta_desc_when_available
      drilldown_target: manufacturer
    manufacturer:
      default_columns: [manufacturer, revenue, contribution_to_delta, units, retailer_margin_abs, retailer_margin_pct, manufacturer_rank_revenue]
      default_sort: contribution_absolute_delta_desc_when_available
      drilldown_target: brand
    brand:
      default_columns: [brand, revenue, contribution_to_delta, units, retailer_margin_abs, category_revenue_share]
      default_sort: contribution_absolute_delta_desc_when_available
      drilldown_target: sku
    sku:
      default_columns: [sku, revenue, contribution_to_delta, units, retailer_margin_abs, weighted_shelf_price_vat, selling_store_count]
      default_sort: contribution_absolute_delta_desc_when_available
      drilldown_target: store
      store_contribution_support: BACKEND_ROUTE_REQUIRED
    store:
      default_columns: [store, revenue, units, retailer_margin_abs, retailer_margin_pct, sku_count]
      default_sort: current_value_desc
      drilldown_target: none
      forbidden_columns: [distribution, velocity, revenue_velocity, margin_velocity]


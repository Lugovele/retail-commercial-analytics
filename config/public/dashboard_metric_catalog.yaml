metrics:
  - metric_concept: revenue_vat
    default_display_label: Gross revenue
    description: VAT-inclusive revenue from deterministic metric outputs.
    format: currency
    dashboard_group: sales
    default_range_aggregation_strategy: sum_available_periods
    default_comparison_support: [NONE, YOY, MOM, PREVIOUS_AVAILABLE]
  - metric_concept: revenue
    default_display_label: Net revenue
    description: Net revenue from deterministic metric outputs.
    format: currency
    dashboard_group: sales
    default_range_aggregation_strategy: sum_available_periods
    default_comparison_support: [NONE, YOY, MOM, PREVIOUS_AVAILABLE]
  - metric_concept: units

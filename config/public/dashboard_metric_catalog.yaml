metrics:
  - metric_concept: revenue_vat
    default_display_label: Оборот с НДС
    description: Оборот с НДС из deterministic metric outputs.
    format: currency
    dashboard_group: sales
    default_range_aggregation_strategy: sum_available_periods
    default_comparison_support: [NONE, YOY, MOM, PREVIOUS_AVAILABLE]
  - metric_concept: revenue
    default_display_label: Оборот без НДС
    description: Оборот без НДС из deterministic metric outputs.
    format: currency
    dashboard_group: sales
    default_range_aggregation_strategy: sum_available_periods
    default_comparison_support: [NONE, YOY, MOM, PREVIOUS_AVAILABLE]
  - metric_concept: units
    default_display_label: Продажи, шт.
    description: Продажи в штуках из deterministic metric outputs.
    format: decimal
    dashboard_group: sales
    default_range_aggregation_strategy: sum_available_periods
    default_comparison_support: [NONE, YOY, MOM, PREVIOUS_AVAILABLE]
  - metric_concept: retailer_margin_abs
    default_display_label: Абсолютная маржа
    description: Абсолютная маржа из deterministic metric outputs.
    format: currency
    dashboard_group: economics
    default_range_aggregation_strategy: sum_available_periods
    default_comparison_support: [NONE, YOY, MOM, PREVIOUS_AVAILABLE]
  - metric_concept: retailer_margin_pct
    default_display_label: Маржинальность
    description: Маржинальность; range-safe только через сохранённые numerator и denominator.
    format: percent
    dashboard_group: economics
    default_range_aggregation_strategy: ratio_of_sums
    default_comparison_support: [NONE, YOY, MOM, PREVIOUS_AVAILABLE]
  - metric_concept: weighted_shelf_price_vat
    default_display_label: Средняя полочная цена с НДС
    description: Средневзвешенная полочная цена с НДС из deterministic metric outputs.
    format: currency
    dashboard_group: price
    default_range_aggregation_strategy: weighted_ratio_of_sums
    default_comparison_support: [NONE, YOY, MOM, PREVIOUS_AVAILABLE]
  - metric_concept: weighted_input_price_vat
    default_display_label: Средняя входная цена с НДС
    description: Средневзвешенная входная цена с НДС из deterministic metric outputs.
    format: currency
    dashboard_group: price
    default_range_aggregation_strategy: weighted_ratio_of_sums
    default_comparison_support: [NONE, YOY, MOM, PREVIOUS_AVAILABLE]
  - metric_concept: selling_store_count
    default_display_label: ТТ с продажами
    description: Количество ТТ с продажами на уровне периода.
    format: integer
    dashboard_group: distribution
    default_range_aggregation_strategy: period_only
    default_comparison_support: [NONE, YOY, MOM, PREVIOUS_AVAILABLE]
    generic_limitations: [selected_range_value_unavailable]
  - metric_concept: active_store_count
    default_display_label: Активные ТТ
    description: Количество активных ТТ на уровне периода.
    format: integer
    dashboard_group: distribution
    default_range_aggregation_strategy: period_only
    default_comparison_support: [NONE, YOY, MOM, PREVIOUS_AVAILABLE]
    generic_limitations: [selected_range_value_unavailable]
  - metric_concept: distribution
    default_display_label: Дистрибуция
    description: Дистрибуция на уровне периода; arbitrary selected-range recomputation не объявлен.
    format: percent
    dashboard_group: distribution
    default_range_aggregation_strategy: period_only
    default_comparison_support: [NONE, YOY, MOM, PREVIOUS_AVAILABLE]
    generic_limitations: [selected_range_value_unavailable]
  - metric_concept: velocity
    default_display_label: Продажи на ТТ
    description: Продажи на ТТ на уровне периода; arbitrary selected-range recomputation не объявлен.
    format: ratio
    dashboard_group: distribution
    default_range_aggregation_strategy: period_only
    default_comparison_support: [NONE, YOY, MOM, PREVIOUS_AVAILABLE]

metrics:
  - metric_concept: revenue_vat
    default_display_label: Оборот с НДС
    description: Оборот с НДС из deterministic metric outputs.
    format: currency
    dashboard_group: sales
    default_range_aggregation_strategy: sum_available_periods
    default_comparison_support: [NONE, YOY, MOM, PREVIOUS_AVAILABLE]
    business_question: Какой оборот с НДС сформирован в выбранном срезе?
    decision_use: Проверить общий денежный масштаб продаж с учётом НДС.
    formula_summary: Сумма оборота с НДС по фактам выбранного среза.
    delta_semantics: OUTCOME_DIRECTIONAL
  - metric_concept: revenue
    default_display_label: Оборот без НДС
    description: Оборот без НДС из deterministic metric outputs.
    format: currency
    dashboard_group: sales
    default_range_aggregation_strategy: sum_available_periods
    default_comparison_support: [NONE, YOY, MOM, PREVIOUS_AVAILABLE]
    business_question: Какой коммерческий оборот сформирован в выбранном срезе?
    decision_use: Оценить основной денежный результат и его изменение.
    formula_summary: Сумма оборота без НДС по фактам выбранного среза.
    delta_semantics: OUTCOME_DIRECTIONAL
  - metric_concept: units
    default_display_label: Продажи, шт.
    description: Продажи в штуках из deterministic metric outputs.
    format: decimal
    dashboard_group: sales
    default_range_aggregation_strategy: sum_available_periods
    default_comparison_support: [NONE, YOY, MOM, PREVIOUS_AVAILABLE]
    business_question: Сколько единиц продано в выбранном срезе?
    decision_use: Отделить изменение физического объёма от ценового эффекта.
    formula_summary: Сумма проданных единиц по фактам выбранного среза.
    delta_semantics: OUTCOME_DIRECTIONAL
  - metric_concept: retailer_margin_abs
    default_display_label: Абсолютная маржа
    description: Абсолютная маржа из deterministic metric outputs.
    format: currency
    dashboard_group: economics
    default_range_aggregation_strategy: sum_available_periods
    default_comparison_support: [NONE, YOY, MOM, PREVIOUS_AVAILABLE]
    business_question: Сколько абсолютной маржи сформировано?
    decision_use: Оценить денежный вклад среза в экономику сети.
    formula_summary: Сумма абсолютной маржи по фактам выбранного среза.
    delta_semantics: OUTCOME_DIRECTIONAL
  - metric_concept: retailer_margin_pct
    default_display_label: Маржинальность
    description: Маржинальность; range-safe только через сохранённые numerator и denominator.
    format: percent
    dashboard_group: economics
    default_range_aggregation_strategy: ratio_of_sums
    default_comparison_support: [NONE, YOY, MOM, PREVIOUS_AVAILABLE]
    business_question: Какой уровень маржинальности у выбранного среза?
    decision_use: Проверить экономическую эффективность продаж.
    formula_summary: Отношение суммы абсолютной маржи к сумме оборота в выбранном срезе.
    delta_semantics: OUTCOME_DIRECTIONAL
  - metric_concept: weighted_shelf_price_vat
    default_display_label: Полочная цена
    description: Средневзвешенная полочная цена с НДС из deterministic metric outputs.
    format: currency
    dashboard_group: price
    default_range_aggregation_strategy: weighted_ratio_of_sums
    default_comparison_support: [NONE, YOY, MOM, PREVIOUS_AVAILABLE]
    business_question: По какой средней полочной цене продавался срез?
    decision_use: Проверить движение цены без вывода о качестве результата.
    formula_summary: Средневзвешенная полочная цена по продажам выбранного среза.
    delta_semantics: NEUTRAL_DIRECTIONAL
  - metric_concept: weighted_input_price_vat
    default_display_label: Входная цена
    description: Средневзвешенная входная цена с НДС из deterministic metric outputs.
    format: currency
    dashboard_group: price
    default_range_aggregation_strategy: weighted_ratio_of_sums
    default_comparison_support: [NONE, YOY, MOM, PREVIOUS_AVAILABLE]
    business_question: Какой средний входной уровень цены у среза?
    decision_use: Проверить изменение входной цены как контекст экономики.
    formula_summary: Средневзвешенная входная цена по продажам выбранного среза.
    delta_semantics: NEUTRAL_DIRECTIONAL
  - metric_concept: selling_store_count
    default_display_label: ТТ с продажами
    description: Количество ТТ с продажами на уровне периода.
    format: integer
    dashboard_group: distribution
    default_range_aggregation_strategy: period_only
    default_comparison_support: [NONE, YOY, MOM, PREVIOUS_AVAILABLE]
    generic_limitations: [selected_range_value_unavailable]
    business_question: В скольких ТТ были продажи выбранного среза?
    decision_use: Оценить присутствие продаж в торговых точках.
    formula_summary: Количество торговых точек с продажами за период.
    delta_semantics: NEUTRAL_DIRECTIONAL
  - metric_concept: active_store_count
    default_display_label: Активные ТТ
    description: Количество активных ТТ на уровне периода.
    format: integer
    dashboard_group: distribution
    default_range_aggregation_strategy: period_only
    default_comparison_support: [NONE, YOY, MOM, PREVIOUS_AVAILABLE]
    generic_limitations: [selected_range_value_unavailable]
    business_question: Сколько ТТ входит в активную базу периода?
    decision_use: Проверить размер доступной базы для оценки присутствия.
    formula_summary: Количество активных торговых точек в периоде.
    delta_semantics: NEUTRAL_DIRECTIONAL
  - metric_concept: distribution
    default_display_label: ND
    description: Нумерическая дистрибуция на уровне периода; arbitrary selected-range recomputation не объявлен.
    format: percent
    dashboard_group: distribution
    default_range_aggregation_strategy: period_only
    default_comparison_support: [NONE, YOY, MOM, PREVIOUS_AVAILABLE]
    generic_limitations: [selected_range_value_unavailable]
    business_question: Какая доля активных ТТ продаёт выбранный срез?
    decision_use: Оценить ширину присутствия без причинной интерпретации.
    formula_summary: Отношение ТТ с продажами к активным ТТ в периоде.
    delta_semantics: NEUTRAL_DIRECTIONAL
  - metric_concept: numeric_distribution_store_format
    default_display_label: Дистрибуция в формате ТТ
    description: Дистрибуция в месячном universe выбранного формата ТТ; selected-range recomputation не объявлен.
    format: percent
    dashboard_group: distribution
    default_range_aggregation_strategy: period_only
    default_comparison_support: [NONE, YOY, MOM, PREVIOUS_AVAILABLE]
    generic_limitations: [selected_range_value_unavailable, requires_store_format_universe]
    business_question: Какая доля ТТ выбранного формата продаёт выбранный срез?
    decision_use: Оценить ширину присутствия внутри утверждённого формата ТТ без причинной интерпретации.
    formula_summary: ТТ с продажами выбранного среза в формате, делённые на все ТТ месячного universe этого формата.
    delta_semantics: NEUTRAL_DIRECTIONAL
  - metric_concept: velocity
    default_display_label: Продажи на ТТ
    description: Продажи на ТТ на уровне периода; arbitrary selected-range recomputation не объявлен.
    format: ratio
    dashboard_group: distribution
    default_range_aggregation_strategy: period_only
    default_comparison_support: [NONE, YOY, MOM, PREVIOUS_AVAILABLE]
    generic_limitations: [selected_range_value_unavailable]
    business_question: Сколько единиц продаётся на одну ТТ с продажами?
    decision_use: Оценить интенсивность продаж там, где товар присутствует.
    formula_summary: Продажи в штуках, делённые на количество ТТ с продажами.
    delta_semantics: NEUTRAL_DIRECTIONAL
  - metric_concept: revenue_velocity
    default_display_label: Оборот на ТТ
    description: Оборот на ТТ на уровне периода.
    format: currency
    dashboard_group: distribution
    default_range_aggregation_strategy: period_only

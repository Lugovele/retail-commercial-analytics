  - metric_concept: revenue_velocity
    default_display_label: Оборот на ТТ
    description: Оборот на ТТ на уровне периода.
    format: currency
    dashboard_group: distribution
    default_range_aggregation_strategy: period_only
    default_comparison_support: [NONE, YOY, MOM, PREVIOUS_AVAILABLE]
    generic_limitations: [selected_range_value_unavailable]
  - metric_concept: margin_velocity
